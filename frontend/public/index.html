<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Beauchapp</title>

    <!-- PWA Manifest & Scope -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beauchapp" />
    <meta name="theme-color" content="#0c0c0c" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Scroll Defensivo y Viewports PWA (Rule 4 & Safe Area Insets iOS) -->
    <style id="expo-reset">
      html {
        height: 100%;
        height: 100dvh;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background-color: #0c0c0c;
        overscroll-behavior-y: contain;
        overscroll-behavior-x: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
        width: 100%;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar Beauchapp.</noscript>
    <div id="root"></div>
  </body>
</html>
