<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Beauchapp Diagnóstico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      background: #0c0c0c;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      overflow: auto;
    }
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .container {
      padding: 16px;
    }
    h1 { font-size: 18px; margin-bottom: 12px; color: #4ade80; }
    h2 { font-size: 14px; margin: 16px 0 8px; color: #60a5fa; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a1a;
    }
    .label { color: #aaa; }
    .value { color: #fff; font-weight: 700; font-family: monospace; }
    .highlight { color: #facc15; }
    .box-test {
      margin-top: 16px;
      border: 2px solid #ef4444;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      color: #ef4444;
    }
    .bottom-marker {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #ef4444;
      z-index: 9999;
    }
    .top-marker {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #4ade80;
      z-index: 9999;
    }
    #safe-area-probe {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      z-index: -1;
    }
  </style>
</head>
<body>
  <!-- Visual markers at absolute top and bottom of viewport -->
  <div class="top-marker"></div>
  <div class="bottom-marker"></div>
  <div id="safe-area-probe"></div>

  <div class="container">
    <h1>📱 Beauchapp iOS Diagnóstico</h1>

    <h2>Viewport & Window</h2>
    <div id="viewport-section"></div>

    <h2>Safe Area Insets (CSS env)</h2>
    <div id="safe-area-section"></div>

    <h2>Modo de Ejecución</h2>
    <div id="mode-section"></div>

    <h2>Elementos DOM</h2>
    <div id="dom-section"></div>

    <h2>User Agent</h2>
    <div id="ua-section" style="word-break: break-all; font-size: 11px; color: #888; padding: 8px 0;"></div>

    <div class="box-test">
      ↕ Si ves una línea ROJA abajo de la pantalla, el viewport llega al borde.<br>
      Si NO la ves, hay espacio muerto debajo.
    </div>
  </div>

  <script>
    function row(label, value, isHighlight) {
      return `<div class="row"><span class="label">${label}</span><span class="value ${isHighlight ? 'highlight' : ''}">${value}</span></div>`;
    }

    function getCSSEnvValue(prop) {
      const el = document.createElement('div');
      el.style.position = 'fixed';
      el.style.visibility = 'hidden';
      el.style.height = `env(${prop}, 0px)`;
      document.body.appendChild(el);
      const val = el.getBoundingClientRect().height;
      document.body.removeChild(el);
      return val;
    }

    function measure() {
      // Viewport & Window
      const vvp = window.visualViewport;
      let vpHTML = '';
      vpHTML += row('window.innerHeight', window.innerHeight + 'px');
      vpHTML += row('window.innerWidth', window.innerWidth + 'px');
      vpHTML += row('window.outerHeight', window.outerHeight + 'px');
      vpHTML += row('screen.height', screen.height + 'px');
      vpHTML += row('screen.availHeight', screen.availHeight + 'px');
      vpHTML += row('document.documentElement.clientHeight', document.documentElement.clientHeight + 'px');
      vpHTML += row('document.body.clientHeight', document.body.clientHeight + 'px');
      vpHTML += row('document.body.scrollHeight', document.body.scrollHeight + 'px');
      if (vvp) {
        vpHTML += row('visualViewport.height', vvp.height + 'px');
        vpHTML += row('visualViewport.offsetTop', vvp.offsetTop + 'px');
        vpHTML += row('visualViewport.scale', vvp.scale);
      }
      // Computed 100dvh
      const dvhProbe = document.createElement('div');
      dvhProbe.style.position = 'fixed';
      dvhProbe.style.visibility = 'hidden';
      dvhProbe.style.height = '100dvh';
      document.body.appendChild(dvhProbe);
      const dvhVal = dvhProbe.getBoundingClientRect().height;
      document.body.removeChild(dvhProbe);
      vpHTML += row('CSS 100dvh (computed)', dvhVal + 'px', true);

      // 100vh
      const vhProbe = document.createElement('div');
      vhProbe.style.position = 'fixed';
      vhProbe.style.visibility = 'hidden';
      vhProbe.style.height = '100vh';
      document.body.appendChild(vhProbe);
      const vhVal = vhProbe.getBoundingClientRect().height;
      document.body.removeChild(vhProbe);
      vpHTML += row('CSS 100vh (computed)', vhVal + 'px');

      // Diff
      const gap = screen.height - dvhVal;
      vpHTML += row('screen.height - 100dvh (gap?)', gap.toFixed(1) + 'px', gap > 0);

      document.getElementById('viewport-section').innerHTML = vpHTML;

      // Safe Area Insets
      const saiTop = getCSSEnvValue('safe-area-inset-top');
      const saiBottom = getCSSEnvValue('safe-area-inset-bottom');
      const saiLeft = getCSSEnvValue('safe-area-inset-left');
      const saiRight = getCSSEnvValue('safe-area-inset-right');

      let saHTML = '';
      saHTML += row('safe-area-inset-top', saiTop + 'px', saiTop > 0);
      saHTML += row('safe-area-inset-bottom', saiBottom + 'px', saiBottom > 0);
      saHTML += row('safe-area-inset-left', saiLeft + 'px');
      saHTML += row('safe-area-inset-right', saiRight + 'px');

      // Probe element computed padding
      const probe = document.getElementById('safe-area-probe');
      const probeStyle = getComputedStyle(probe);
      saHTML += row('probe paddingTop (computed)', probeStyle.paddingTop);
      saHTML += row('probe paddingBottom (computed)', probeStyle.paddingBottom);

      document.getElementById('safe-area-section').innerHTML = saHTML;

      // Mode
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      let modeHTML = '';
      modeHTML += row('navigator.standalone', String(window.navigator.standalone));
      modeHTML += row('display-mode: standalone', String(window.matchMedia('(display-mode: standalone)').matches));
      modeHTML += row('Modo detectado', isStandalone ? '✅ PWA Standalone' : '🌐 Browser', true);
      modeHTML += row('devicePixelRatio', window.devicePixelRatio);
      document.getElementById('mode-section').innerHTML = modeHTML;

      // DOM
      let domHTML = '';
      const bodyRect = document.body.getBoundingClientRect();
      domHTML += row('body.top', bodyRect.top.toFixed(1) + 'px');
      domHTML += row('body.bottom', bodyRect.bottom.toFixed(1) + 'px');
      domHTML += row('body.height', bodyRect.height.toFixed(1) + 'px');
      const htmlRect = document.documentElement.getBoundingClientRect();
      domHTML += row('html.height', htmlRect.height.toFixed(1) + 'px');

      // Bottom marker position
      const marker = document.querySelector('.bottom-marker');
      if (marker) {
        const mRect = marker.getBoundingClientRect();
        domHTML += row('bottomMarker.top (should = innerH-4)', mRect.top.toFixed(1) + 'px', true);
        domHTML += row('bottomMarker.bottom', mRect.bottom.toFixed(1) + 'px');
      }

      document.getElementById('dom-section').innerHTML = domHTML;

      // UA
      document.getElementById('ua-section').textContent = navigator.userAgent;
    }

    // Run on load and on resize
    window.addEventListener('load', () => setTimeout(measure, 300));
    window.addEventListener('resize', measure);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', measure);
    }
  </script>
</body>
</html>
