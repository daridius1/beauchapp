name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Nivel "critical": no quedan vulnerabilidades críticas.
      #
      # Revisado el 2026-08-19: quedan 9 altas, TODAS en tooling de build (image-size,
      # postcss, metro, @expo/cli) — ninguna viaja en el bundle que reciben los usuarios.
      # Solo se resuelven con el upgrade mayor de Expo 54→57, planificado como fase aparte
      # (ver auditoria-2026-08-19.md §4.6). Lo que sí era corregible sin breaking changes
      # (nanoid) ya se aplicó.
      #
      # SUBIR este umbral a "high" en cuanto el upgrade de Expo esté hecho, y volver a
      # anotar acá la fecha de revisión. Un umbral en "critical" sin fecha se convierte
      # en un gate que nadie vuelve a mirar.
      - name: Audit (sin vulnerabilidades críticas)
        run: npm audit --audit-level=critical

  backend-lib-tests:
    name: Backend (lógica pura de pb_hooks/lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run pure-logic tests
        run: npm run test:backend
